name: Publish

on:
  workflow_run:
    workflows: [Release Please]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-release:
    name: Check if a release was created
    runs-on: ubuntu-slim
    if: ${{ github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' }}
    outputs:
      release_created: ${{ steps.check.outputs.release_created }}

    permissions:
      actions: read

    steps:
      - name: Download release outputs 📥
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v8
        with:
          name: release-outputs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check release outputs 🔎
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_created=$(cat release_created 2>/dev/null || echo false)" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish npm package
    needs: check-release
    if: ${{ needs.check-release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Setup node env 🏗
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies 👨🏻‍💻
        run: npm ci

      - name: Build TypeScript 🔨
        run: npm run build

      - name: Publish to npm 📦
        run: npm publish --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup node env for GitHub Packages 🏗
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: https://npm.pkg.github.com

      - name: Publish to GitHub Packages 📦
        run: npm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
